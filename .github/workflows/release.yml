name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # 1.93.1 (pinned to match rust-toolchain.toml)
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
          # Install components declared in rust-toolchain.toml up front. Without
          # this, rustup auto-installs them the first time cargo runs, which
          # fails on Windows with `error: target was empty`.
          components: rustfmt, clippy
      - name: Build release binaries
        # `shell: bash` is required on Windows runners so that `"$TARGET"`
        # expands as an env var (git-bash). PowerShell would treat `$TARGET`
        # as an undefined PS variable and pass an empty --target argument
        # to cargo, producing `error: target was empty`.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          cd "target/${TARGET}/release"
          tar czf "../../../libsvm-rs-${REF_NAME}-${TARGET}.tar.gz" svm-train-rs svm-predict-rs svm-scale-rs
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          Set-Location "target/${env:TARGET}/release"
          $archive = "../../../libsvm-rs-${env:REF_NAME}-${env:TARGET}.zip"
          Compress-Archive -Path svm-train-rs.exe, svm-predict-rs.exe, svm-scale-rs.exe -DestinationPath $archive
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            libsvm-rs-*.tar.gz
            libsvm-rs-*.zip

  release:
    name: Create Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Extract changelog for this version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for ${VERSION}, falling back to auto-generated notes." > RELEASE_NOTES.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            libsvm-rs-*.tar.gz
            libsvm-rs-*.zip

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # 1.93.1 (pinned to match rust-toolchain.toml)
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Publish
        run: cargo publish --locked -p libsvm-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
